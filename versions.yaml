# Single source of truth for every release input.
#
# Parsed by scripts/lib/flatten-yaml.awk, which supports a restricted YAML
# subset: two-space indentation, nested mappings with scalar leaves, and
# lists of plain scalars. Keep this file inside that subset.

postgres:
  version: "18.6"
  source:
    filename: "postgresql-18.6.tar.bz2"
    # Official release download location (never a GitHub mirror commit).
    url_base: "https://ftp.postgresql.org/pub/source/v18.6"
    # Pinned upstream SHA-256 of the source tarball. Verification fails
    # closed on mismatch (scripts/verify-source.sh).
    sha256: "555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f"

runtime:
  # Bump when packaging or build flags change without changing PostgreSQL
  # itself. Runtime version is "<postgres-version>+runtime.<revision>".
  revision: 2

extensions:
  required:
    - pg_trgm
    - pg_stat_statements
    - ltree
    - pg_textsearch
  optional:
    - unaccent

# Third-party extensions (plan §19). Adding one here is a standing audit
# and update obligation, not a one-line config change — each entry needs
# reviewed source provenance, a pinned commit (verified at build time by
# scripts/build-third-party.sh, which fails closed on any mismatch), and a
# recorded license review. Extensions listed here still go through the
# same required/optional smoke- and relocation-testing as PostgreSQL's own
# supplied contrib modules (see the `extensions` key above).
third_party:
  pg_textsearch:
    # BM25 ranked full-text search: github.com/timescale/pg_textsearch.
    # Reviewed 2026-08-14: permissive license (same as PostgreSQL itself);
    # pure C, builds via PGXS with no dependencies beyond PostgreSQL's own
    # headers; supports PostgreSQL 17 and 18.
    repo: "https://github.com/timescale/pg_textsearch.git"
    ref: "v1.4.0"
    commit: "7a932505b537d50ad8d2d068a053cd1dd7b646ea"
    license: "PostgreSQL"

# Platforms CI builds and relocation-tests natively. A platform must never
# be published from a cross-compiled, untested build.
platforms:
  - linux-amd64
  - linux-arm64
  - darwin-arm64
  - darwin-amd64
